<!DOCTYPE html>
<html>
<head>
    <title>AI Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        .section {
            margin: 20px 0;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            background: #007bff;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background: #0056b3;
        }
        #result {
            margin-top: 20px;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 5px;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .error {
            background: #fee;
            border: 1px solid #fcc;
        }
        .success {
            background: #efe;
            border: 1px solid #cfc;
        }
    </style>
</head>
<body>
    <h1>🧪 CollabDocs AI Endpoint Test</h1>
    
    <div class="section">
        <h2>Test 1: Health Check</h2>
        <button onclick="testHealth()">Test Health Endpoint</button>
    </div>
    
    <div class="section">
        <h2>Test 2: AI Advanced Endpoint</h2>
        <button onclick="testAI()">Test AI Endpoint</button>
    </div>
    
    <div id="result"></div>

    <script>
        const resultDiv = document.getElementById('result');

        async function testHealth() {
            resultDiv.className = '';
            resultDiv.textContent = '⏳ Testing health endpoint...';
            
            try {
                const response = await fetch('http://localhost:5000/health');
                const contentType = response.headers.get('content-type');
                
                resultDiv.textContent = `✅ Health Check Success!\n\n`;
                resultDiv.textContent += `Status: ${response.status}\n`;
                resultDiv.textContent += `Content-Type: ${contentType}\n\n`;
                
                if (contentType && contentType.includes('application/json')) {
                    const data = await response.json();
                    resultDiv.textContent += `Response: ${JSON.stringify(data, null, 2)}`;
                    resultDiv.className = 'success';
                } else {
                    const text = await response.text();
                    resultDiv.textContent += `Response (first 500 chars):\n${text.substring(0, 500)}`;
                    resultDiv.className = 'error';
                }
            } catch (error) {
                resultDiv.className = 'error';
                resultDiv.textContent = `❌ Health Check Failed!\n\n`;
                resultDiv.textContent += `Error: ${error.message}\n`;
                resultDiv.textContent += `Type: ${error.name}\n\n`;
                resultDiv.textContent += `This usually means the backend is not running or not accessible on port 5000.`;
            }
        }

        async function testAI() {
            resultDiv.className = '';
            resultDiv.textContent = '⏳ Testing AI endpoint...';
            
            const requestBody = {
                text: 'hello',
                task: 'generate',
                prompt: 'Write a professional hello world message',
                toneTarget: 'professional',
                length: 'short'
            };
            
            try {
                console.log('📤 Sending request:', requestBody);
                
                const response = await fetch('http://localhost:5000/api/ai/advanced', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(requestBody)
                });
                
                console.log('📥 Response received:', response.status);
                
                const contentType = response.headers.get('content-type');
                
                resultDiv.textContent = `Response Status: ${response.status}\n`;
                resultDiv.textContent += `Content-Type: ${contentType}\n\n`;
                
                if (contentType && contentType.includes('application/json')) {
                    const data = await response.json();
                    console.log('✅ JSON Response:', data);
                    
                    if (data.success) {
                        resultDiv.className = 'success';
                        resultDiv.textContent += `✅ AI SUCCESS!\n\n`;
                        resultDiv.textContent += `Provider: ${data.provider}\n`;
                        resultDiv.textContent += `Result:\n${data.result}`;
                    } else {
                        resultDiv.className = 'error';
                        resultDiv.textContent += `❌ AI Error:\n${data.error}\n`;
                        if (data.details) {
                            resultDiv.textContent += `Details: ${data.details}`;
                        }
                    }
                } else {
                    // This is where we catch the HTML error!
                    const text = await response.text();
                    console.error('❌ Non-JSON Response:', text);
                    
                    resultDiv.className = 'error';
                    resultDiv.textContent += `❌ ERROR: Backend returned HTML instead of JSON!\n\n`;
                    resultDiv.textContent += `This is the "<!DOCTYPE" error you've been seeing.\n\n`;
                    resultDiv.textContent += `Full Response (first 1000 chars):\n\n`;
                    resultDiv.textContent += text.substring(0, 1000);
                }
            } catch (error) {
                console.error('❌ Request failed:', error);
                resultDiv.className = 'error';
                resultDiv.textContent = `❌ Request Failed!\n\n`;
                resultDiv.textContent += `Error: ${error.message}\n`;
                resultDiv.textContent += `Type: ${error.name}\n\n`;
                resultDiv.textContent += `This usually means:\n`;
                resultDiv.textContent += `1. Backend is not running\n`;
                resultDiv.textContent += `2. Port 5000 is blocked\n`;
                resultDiv.textContent += `3. CORS issues\n`;
            }
        }
    </script>
</body>
</html>
